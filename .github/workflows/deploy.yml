name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Apply clean portfolio publish bundle if needed
        run: |
          if [ -f public/data/portfolio-sections.json ] && [ -d public/portfolio-images/section-sheets ]; then
            echo "Extracted portfolio site files already exist at the repository root."
          else
            if [ ! -f dor_fellous_site_publish_bundle.zip ]; then
              echo "dor_fellous_site_publish_bundle.zip was not found at the repository root."
              exit 1
            fi
            unzip -o dor_fellous_site_publish_bundle.zip
            git checkout -- .github/workflows/deploy.yml
            rm -f script.js styles.css
            rm -f public/content/site-content.json public/media/intro-portrait.svg public/media/.gitkeep
            rm -f src/contentRenderer.js src/controls.js src/editor.js src/navigation.js src/scene.js src/scrollVideo.js src/sections.js
          fi

      - name: Apply approved navigation update
        run: node scripts/apply-navigation-update.mjs

      - name: Commit extracted site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No extracted site changes to commit."
          else
            git commit -m "Apply clean portfolio/store website bundle"
            git push
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare video assets
        run: |
          mkdir -p public/assets/video
          cp "VIDEO FOR WEBSITE READY .mp4" "public/assets/video/VIDEO FOR WEBSITE READY .mp4"
          cp "Background opmtimized .mp4" "public/assets/video/Background opmtimized .mp4"

      - name: Prepare portfolio PDF
        run: |
          mkdir -p public/assets/pdf
          cp "ready Dor fellous Creative protfolio 2026  2.pdf" "public/assets/pdf/ready Dor fellous Creative protfolio 2026 2.pdf"

      - name: Prepare profile image
        run: |
          mkdir -p public/assets/profile
          cp "website profile image .JPG" "public/assets/profile/website profile image .JPG"

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
