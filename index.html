<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Interactive 3D architectural portfolio entrance for Dor Fellous."
    />
    <title>Dor Fellous Interactive Portfolio</title>
  </head>
  <body>
    <div id="app">
      <canvas id="scene-canvas" aria-label="Interactive 3D portfolio entrance"></canvas>

      <div id="desktop-start" class="desktop-start">
        <button id="enter-button" type="button">Enter</button>
      </div>

      <div id="transition-layer" class="transition-layer" aria-hidden="true"></div>

      <section id="section-page" class="section-page" aria-live="polite" hidden>
        <button id="back-button" class="back-button" type="button">Back to entrance</button>
        <div class="section-content">
          <p id="section-kicker" class="section-kicker">Dor Fellous</p>
          <h1 id="section-title"></h1>
          <p id="section-copy" class="section-copy"></p>
        </div>
      </section>

      <aside id="mobile-fallback" class="mobile-fallback" hidden>
        <p>This interactive entrance is best experienced on desktop.</p>
        <nav id="mobile-section-links" aria-label="Portfolio sections"></nav>
      </aside>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
